name: Optional local frames
on:
  push:
    paths:
      - .github/workflows/frames.yml
      - scripts/media.py
      - scripts/frame_environment.py
      - scripts/requirements-frames.txt
  pull_request:
    paths:
      - .github/workflows/frames.yml
      - scripts/media.py
      - scripts/frame_environment.py
      - scripts/requirements-frames.txt
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frames:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: scripts/requirements-frames.txt
      - name: Missing packages fail without claiming host vision
        run: >-
          python -c "import json, subprocess, sys;
          r = subprocess.run([sys.executable, '-S', 'scripts/frame_environment.py', 'doctor'], capture_output=True, text=True);
          data = json.loads(r.stdout);
          assert r.returncode == 2, r.returncode;
          assert data['local_frame_extraction'] == 'unavailable', data;
          assert data['host_vision']['status'] == 'not_tested', data;
          print(r.stdout)"
      - run: python -m pip install --only-binary=:all: -r scripts/requirements-frames.txt
      - run: python scripts/frame_environment.py doctor
      - run: python scripts/frame_environment.py smoke
